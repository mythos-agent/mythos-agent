name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Mint a GitHub App installation token if the App is configured for
      # this repo. Skipped when RELEASE_PLEASE_APP_ID is unset, so the
      # workflow falls through to the PAT or GITHUB_TOKEN tier below.
      - name: Generate GitHub App token (if configured)
        id: app-token
        if: ${{ vars.RELEASE_PLEASE_APP_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        with:
          # Three-tier token resolution, in order of preference:
          #   1. GitHub App installation token — no expiration to rotate,
          #      scoped via App installation, audit trail shows the App.
          #      Set vars.RELEASE_PLEASE_APP_ID + secrets.RELEASE_PLEASE_APP_PRIVATE_KEY.
          #   2. Fine-grained PAT — simpler setup but expires on a schedule.
          #      Set secrets.RELEASE_PLEASE_TOKEN.
          #   3. GITHUB_TOKEN — workflow default; degraded mode. Release
          #      PRs created with it don't fire ci.yml's pull_request
          #      trigger, so merges require close+reopen; sigstore-release
          #      is still signed because release-please.yml invokes it as
          #      a reusable workflow inline (sign-release job below).
          token: ${{ steps.app-token.outputs.token || secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-npm:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df # v2
        with:
          # Publish path is the highest-value target (registry upload).
          # Audit now, block later once endpoints are enumerated
          # (expected: registry.npmjs.org, fulcio.sigstore.dev,
          # rekor.sigstore.dev). See docs/security/threat-model.md § S4.
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org/"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # `--provenance` requires a public GitHub source repository — npm
      # rejects provenance bundles from private repos with E422. The flag
      # is auto-enabled on `push` events once the repository flips to
      # public; until then, sigstore-release.yml provides cosign keyless
      # attestation that works regardless of visibility.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM }}
          PROVENANCE_FLAG: ${{ github.event.repository.visibility == 'public' && '--provenance' || '' }}
        run: npm publish --access public $PROVENANCE_FLAG

  # Sign-and-attest the release inline. The `release: published` event
  # created by release-please's GITHUB_TOKEN does not fire downstream
  # workflows (anti-recursion safeguard), so sigstore-release.yml's
  # release-triggered run never executes. Calling it here as a reusable
  # workflow bypasses that limitation and removes the need for manual
  # workflow_dispatch after each release.
  sign-release:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/sigstore-release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
